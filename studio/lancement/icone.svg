<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2E33"/>
      <stop offset="1" stop-color="#16181B"/>
    </linearGradient>
    <linearGradient id="carte" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F4EE"/>
      <stop offset="1" stop-color="#E9E4DA"/>
    </linearGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="ombre-icone" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- le corps de l'icône, grille des icônes macOS (824 px dans 1024) -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#fond)" filter="url(#ombre-icone)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>

  <!-- trois cartes, la pile des contenus -->
  <g transform="rotate(-9 512 540)" filter="url(#ombre)">
    <rect x="318" y="268" width="388" height="492" rx="44" fill="#4A4E55"/>
  </g>
  <g transform="rotate(5 512 540)" filter="url(#ombre)">
    <rect x="318" y="268" width="388" height="492" rx="44" fill="#8D8F93"/>
  </g>
  <g filter="url(#ombre)">
    <rect x="318" y="276" width="388" height="492" rx="44" fill="url(#carte)"/>
    <!-- la vidéo de la carte -->
    <rect x="352" y="310" width="320" height="270" rx="26" fill="#22252A"/>
    <path d="M478 392 L478 498 L566 445 Z" fill="#E8743B" stroke="#E8743B" stroke-width="14" stroke-linejoin="round"/>
    <!-- deux lignes de texte -->
    <rect x="352" y="614" width="236" height="26" rx="13" fill="#2B2E33"/>
    <rect x="352" y="664" width="164" height="22" rx="11" fill="#2B2E33" fill-opacity="0.35"/>
    <!-- le repère du stade -->
    <circle cx="660" cy="712" r="20" fill="#E8743B"/>
  </g>
</svg>
