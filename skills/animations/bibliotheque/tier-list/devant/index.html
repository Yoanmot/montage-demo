<script>
// ===================================================== PARAMÈTRES (seule partie à changer d'une vidéo à l'autre)
// Textes : directement dans le HTML ci-dessus. Durée du calque : data-duration de #root et dernière ligne de la timeline.
// Instants en secondes depuis le début du calque (image n = n / 30). Chacun se cale sur l'attaque d'un mot de la voix
// (moins APPARITION.avance = 0,04 s pour une entrée animée). Les durées des tweens viennent de apparitionReglages(h).
const T = {
  t01: 0.3333,   // #a0 bouge
  t02: 0.4328,   // #st0 visible
  t03: 0.4333,   // #a0 bouge
  t04: 0.4933,   // #a1 bouge, #a2 bouge, #a3 bouge
  t05: 0.8333,   // #a0 bouge
  t06: 0.9133,   // #a0 bouge
  t07: 1.5000,   // #a1 bouge
  t08: 1.5328,   // #st0 caché
  t09: 1.5995,   // #st1 visible
  t10: 1.6000,   // #a1 bouge
  t11: 1.6600,   // #a2 bouge, #a3 bouge
  t12: 2.0000,   // #a1 bouge
  t13: 2.0800,   // #a1 bouge
  t14: 2.7667,   // #a2 bouge
  t15: 2.8662,   // #st1 caché, #st2 visible
  t16: 2.8667,   // #a2 bouge
  t17: 2.9267,   // #a3 bouge
  t18: 3.2667,   // #a2 bouge
  t19: 3.3467,   // #a2 bouge
  t20: 3.7995,   // #st2 caché
  t21: 3.8000,   // #a3 bouge
  t22: 3.8995,   // #st3 visible
  t23: 3.9000,   // #a3 bouge

  t25: 4.3800,   // #a3 bouge
  t26: 5.2995,   // #st3 caché
};

<script src="../../vendor/gsap.min.js"></script>
<script>
// SOUS-TITRES:debut (bloc écrit par scripts/lib/style.mjs depuis commun.mjs : ne pas le modifier à la main)
const STG = {"padX":12.07,"fsp":-3.55,"pvTop":7.19,"lhPx":85.91,"glisse":0.12,"entree":0.15,"montee":14,"sortie":0.11,"pave":true};
const SousTitres = {
  // Construit la ligne dans el (ombre, pavé, texte) avec les mots donnés, ou ceux de son texte (un élément enfant = un mot).
  // coupe (réglage « volume », lignes 2) : indice du premier mot de la deuxième ligne ; le bloc reste centré sur la place
  // des sous-titres (remonté d'une demi-ligne).
  ligne(el, mots, coupe) {
    if (!mots) { mots = []; for (const n of el.childNodes) { if (n.nodeType === 3) mots.push(...n.nodeValue.split(/[ \t\n\r]+/).filter(Boolean)); else if (n.textContent.trim()) mots.push(n.textContent.trim()); } }
    el.classList.add('st-l'); el.textContent = '';
    const mk = (c) => { const d = document.createElement('div'); d.className = c; return d; };
    const inn = mk('st-in'), o = mk('st-o'), pv = mk('st-pv'), t = mk('st-t');
    o.dataset.ombre = '1';
    mots.forEach((w, i) => { for (const c of [o, t]) { if (i) c.append(i === coupe ? document.createElement('br') : ' '); const s = document.createElement('span'); s.textContent = w; c.append(s); } });
    if (coupe) el.style.marginTop = (-STG.lhPx / 2) + 'px';
    inn.append(o, pv, t); el.append(inn);
    return { el, pv, spans: [...t.children] };
  },
  // pavé sous le mot i : de son bord gauche - padX à son bord droit + padX (la dernière lettre sans son approche)
  _g(L, i) { return { left: () => L.spans[i].offsetLeft - STG.padX, top: () => L.spans[i].offsetTop + STG.pvTop, width: () => L.spans[i].offsetWidth - STG.fsp + 2 * STG.padX }; },
  // sans pavé (STG.pave false, réglage « pave » de sous-titres.json) : le pavé n'est jamais montré, sauf posé de force
  // (le MOT d'un CTA : il marque le mot à écrire en commentaire)
  poser(tl, L, i, t, force) {
    if (!STG.pave && !force) { L.pv.style.display = 'none'; return; }
    if (!STG.pave) tl.set(L.pv, { display: 'block' }, t);
    tl.set(L.pv, this._g(L, i), t);
  },
  glisser(tl, L, i, t) { if (STG.pave) tl.to(L.pv, { ...this._g(L, i), duration: STG.glisse, ease: 'none', immediateRender: false }, t); },
  // entrée du premier groupe après un blanc : monte de 14 px en fondu ; sortie en fondu avant un blanc
  monter(tl, el, t) { tl.fromTo(el, { y: STG.montee, opacity: 0 }, { y: 0, opacity: 1, duration: STG.entree, ease: 'none', immediateRender: false }, t); },
  sortir(tl, el, t) { tl.to(el, { opacity: 0, duration: STG.sortie, ease: 'none', immediateRender: false }, t - STG.sortie); },
  // ligne d'un gabarit (#st, #st0…) : pavé sur son premier mot dès qu'elle s'affiche, puis sur chaque mot à son attaque
  // (data-attaques, secondes du calque, écrit par instancier.mjs) ; glisse : [indice du mot, instant] en plus (CTA).
  gabarit(tl, el, glisses = []) {
    const L = this.ligne(el);
    this.poser(tl, L, 0, 0);
    const at = (el.dataset.attaques || '').split(',').filter(Boolean).map(Number);
    at.forEach((t, i) => { if (i > 0 && i < L.spans.length) this.glisser(tl, L, i, t); });
    for (const [i, t] of glisses) { const k = i < 0 ? L.spans.length + i : i; if (STG.pave) this.glisser(tl, L, k, t); else this.poser(tl, L, k, t, true); }
    return L;
  },
};
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const k in (window.__timelines || {})) window.__timelines[k].invalidate(); });
// SOUS-TITRES:fin
const tl = gsap.timeline({ paused: true });
tl.set('#a0', { x: -173, y: 908 }, 0);
tl.set('#a0', { zIndex: 10 }, T.t01);
tl.to('#a0', { scale: 1.08, boxShadow: '0 18px 30px rgba(0,0,0,0.55)', duration: 0.1, ease: 'power2.out' }, T.t01);
tl.to('#a0', { x: 0, y: 0, duration: 0.4, ease: 'power3.inOut' }, T.t03);
tl.to('#a0', { scale: 1, boxShadow: '0 0px 0px rgba(0,0,0,0)', duration: 0.08, ease: 'power2.out' }, T.t05);
tl.set('#a0', { zIndex: 5 }, T.t06);
tl.to('#a1', { x: -173, duration: 0.28, ease: 'power3.out' }, T.t04);
tl.to('#a2', { x: -173, duration: 0.28, ease: 'power3.out' }, T.t04);
tl.to('#a3', { x: 167, duration: 0.28, ease: 'power3.out' }, T.t04);
tl.set('#a1', { x: -3, y: 735 }, 0);
tl.set('#a1', { zIndex: 10 }, T.t07);
tl.to('#a1', { scale: 1.08, boxShadow: '0 18px 30px rgba(0,0,0,0.55)', duration: 0.1, ease: 'power2.out' }, T.t07);
tl.to('#a1', { x: 0, y: 0, duration: 0.4, ease: 'power3.inOut' }, T.t10);
tl.to('#a1', { scale: 1, boxShadow: '0 0px 0px rgba(0,0,0,0)', duration: 0.08, ease: 'power2.out' }, T.t12);
tl.set('#a1', { zIndex: 5 }, T.t13);
tl.to('#a2', { x: -343, duration: 0.28, ease: 'power3.out' }, T.t11);
tl.to('#a3', { x: -3, duration: 0.28, ease: 'power3.out' }, T.t11);
tl.set('#a2', { x: -3, y: 735 }, 0);
tl.set('#a2', { zIndex: 10 }, T.t14);
tl.to('#a2', { scale: 1.08, boxShadow: '0 18px 30px rgba(0,0,0,0.55)', duration: 0.1, ease: 'power2.out' }, T.t14);
tl.to('#a2', { x: 0, y: 0, duration: 0.4, ease: 'power3.inOut' }, T.t16);
tl.to('#a2', { scale: 1, boxShadow: '0 0px 0px rgba(0,0,0,0)', duration: 0.08, ease: 'power2.out' }, T.t18);
tl.set('#a2', { zIndex: 5 }, T.t19);
tl.to('#a3', { x: -173, duration: 0.28, ease: 'power3.out' }, T.t17);
tl.set('#a3', { x: 337, y: 562 }, 0);
tl.set('#a3', { zIndex: 10 }, T.t21);
tl.to('#a3', { scale: 1.08, boxShadow: '0 18px 30px rgba(0,0,0,0.55)', duration: 0.1, ease: 'power2.out' }, T.t21);
tl.to('#a3', { x: 0, y: 0, duration: 0.4, ease: 'power3.inOut' }, T.t23);
tl.to('#a3', { scale: 1, boxShadow: '0 0px 0px rgba(0,0,0,0)', duration: 0.08, ease: 'power2.out' }, T.t24);
tl.set('#a3', { zIndex: 5 }, T.t25);
tl.set('#st0', { visibility: 'hidden' }, 0);
tl.set('#st0', { visibility: 'visible' }, T.t02);
tl.set('#st0', { visibility: 'hidden' }, T.t08);
tl.set('#st1', { visibility: 'hidden' }, 0);
tl.set('#st1', { visibility: 'visible' }, T.t09);
tl.set('#st1', { visibility: 'hidden' }, T.t15);
tl.set('#st2', { visibility: 'hidden' }, 0);
tl.set('#st2', { visibility: 'visible' }, T.t15);
tl.set('#st2', { visibility: 'hidden' }, T.t20);
tl.set('#st3', { visibility: 'hidden' }, 0);
tl.set('#st3', { visibility: 'visible' }, T.t22);
tl.set('#st3', { visibility: 'hidden' }, T.t26);
for (const id of ['st0', 'st1', 'st2', 'st3']) SousTitres.gabarit(tl, document.getElementById(id));   // pavé sur chaque mot à son attaque (data-attaques)
tl.set({}, {}, 5.666666666666667);
window.__timelines = window.__timelines || {};
window.__timelines['root'] = tl;
</script>
