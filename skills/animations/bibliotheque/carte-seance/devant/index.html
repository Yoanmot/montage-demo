<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Big Shoulders Display';src:url('../../fonts/BigShouldersDisplay.ttf');font-weight:100 900;font-style:normal;}
@font-face{font-family:'Bricolage Grotesque';src:url('../../fonts/BricolageGrotesque.ttf');font-weight:200 800;font-style:normal;}
@font-face{font-family:'Roboto';src:url('../../fonts/Roboto.ttf');font-weight:100 900;font-style:normal;}
html,body{margin:0;background:transparent;}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:transparent;}
.a{position:absolute;white-space:nowrap;}
.ti{font-family:'Big Shoulders Display';font-weight:900;text-transform:uppercase;line-height:0.84;
  letter-spacing:0;margin:0;font-variant-numeric:tabular-nums;}
.tx{font-family:'Bricolage Grotesque';font-weight:800;line-height:1.06;letter-spacing:-0.012em;
  font-variation-settings:"opsz" 96;}
.c-or{color:#F15A24;}.c-cr{color:#F6F0E7;}.c-ch{color:#1A1612;}
.douce{text-shadow:0 6px 30px rgba(0,0,0,.45);}.dure{text-shadow:0 4px 0 rgba(26,22,18,.6),0 0 20px rgba(0,0,0,.35);}
.pav{display:inline-block;background:#F15A24;color:#1A1612;border-radius:10px;
  padding:6px 20px 10px;box-shadow:0 5px 0 #B8400F;}

.card{position:absolute;background:#1A1612;color:#F6F0E7;border-radius:18px;box-shadow:inset 0 0 0 2px rgba(246,240,231,.08),0 18px 50px rgba(0,0,0,.5);font-family:'Bricolage Grotesque';box-sizing:border-box;}
.card.tabbed{border-top-left-radius:0;}
.tab{position:absolute;left:0;bottom:100%;height:64px;padding:0 26px;background:#F15A24;color:#1A1612;font:800 46px/68px 'Big Shoulders Display';text-transform:uppercase;letter-spacing:.01em;border-radius:10px 10px 0 0;white-space:nowrap;}
.tab .n{opacity:0.62;margin-left:14px;}
.rw{display:grid;grid-template-columns:56px 132px minmax(0,1fr);align-items:center;gap:24px;padding:14px;border-radius:12px;}
.rw + .rw{margin-top:8px;}
.rw .i{font:900 72px/1 'Big Shoulders Display';color:#F15A24;text-align:center;}
.rw img{width:132px;height:132px;border-radius:10px;object-fit:cover;display:block;}
.rw .nm{font:800 46px/1.05 'Bricolage Grotesque';font-variation-settings:"opsz" 96;letter-spacing:-.01em;}
.rw .sm{display:block;font:500 30px/1.2 'Bricolage Grotesque';color:rgba(246,240,231,0.62);margin-top:6px;letter-spacing:0;}
.rw.on{background:#F6F0E7;color:#1A1612;}
.rw.on .sm{color:rgba(26,22,18,.6);}
.num{font-variant-numeric:tabular-nums;}.lc{text-transform:none;}</style></head>
<body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-start="0" data-duration="6">
  <div id="pl" style="visibility:hidden"><div class="card tabbed" id="cd" style="left:91px;top:600px;width:899px;padding:38px">
    <div class="tab">séance abdos<span class="n">3 exercices</span></div>
    <div class="rw on" id="r0"><span class="i">1</span><img src="../../images/image-a-fournir.svg" data-a-fournir="photo carrée de l'exercice 1 (roulette), photo de Romain"><span class="nm">Roulette</span></div>
    <div class="rw on" id="r1"><span class="i">2</span><img src="../../images/image-a-fournir.svg" data-a-fournir="photo carrée de l'exercice 2 (relevé de jambes), photo de Romain"><span class="nm">Relevé de jambes</span></div>
    <div class="rw on" id="r2"><span class="i">3</span><img src="../../images/image-a-fournir.svg" data-a-fournir="photo carrée de l'exercice 3 (GHD sit-up), photo de Romain"><span class="nm">GHD sit-up<span class="sm" id="sm">ou même des variantes plus simples</span></span></div>
  </div></div>
</div>
<script>
// ===================================================== PARAMÈTRES (seule partie à changer d'une vidéo à l'autre)
// Textes : directement dans le HTML ci-dessus. Durée du calque : data-duration de #root et dernière ligne de la timeline.
// Instants en secondes depuis le début du calque (image n = n / 30). Chacun se cale sur l'attaque d'un mot de la voix
// (moins APPARITION.avance = 0,04 s pour une entrée animée). Les durées des tweens viennent de apparitionReglages(h).
const T = {
  t01: 0.2328,   // #pl visible
  t02: 0.2333,   // #cd apparaît
  t03: 0.4300,   // #r0 apparaît
  t04: 1.3300,   // #r1 apparaît, #r0 bouge, #r0 .sm bouge
  t05: 2.3800,   // #r2 apparaît, #r1 bouge, #r1 .sm bouge
  t06: 3.9500,   // #sm apparaît
  t07: 5.5995,   // #pl caché
};
</script>
<script src="../../vendor/gsap.min.js"></script>
<script>
const tl = gsap.timeline({ paused: true });
tl.fromTo('#cd', { y: 36.4 }, { y: 0, duration: 0.550, ease: 'power3.out', immediateRender: true }, T.t02);
tl.fromTo('#cd', { opacity: 0 }, { opacity: 1, duration: 0.450, ease: 'power2.out', immediateRender: true }, T.t02);
tl.fromTo('#cd', { filter: 'blur(14.0px)' }, { filter: 'blur(0px)', duration: 0.850, ease: 'power2.out', immediateRender: true }, T.t02);
tl.fromTo('#r0', { y: 20.8 }, { y: 0, duration: 0.446, ease: 'power3.out', immediateRender: true }, T.t03);
tl.fromTo('#r0', { opacity: 0 }, { opacity: 1, duration: 0.372, ease: 'power2.out', immediateRender: true }, T.t03);
tl.fromTo('#r0', { filter: 'blur(8.0px)' }, { filter: 'blur(0px)', duration: 0.563, ease: 'power2.out', immediateRender: true }, T.t03);
tl.fromTo('#r1', { y: 20.8 }, { y: 0, duration: 0.446, ease: 'power3.out', immediateRender: true }, T.t04);
tl.fromTo('#r1', { opacity: 0 }, { opacity: 1, duration: 0.372, ease: 'power2.out', immediateRender: true }, T.t04);
tl.fromTo('#r1', { filter: 'blur(8.0px)' }, { filter: 'blur(0px)', duration: 0.563, ease: 'power2.out', immediateRender: true }, T.t04);
tl.to('#r0', { backgroundColor: 'rgba(246,240,231,0)', color: '#F6F0E7', opacity: 0.38, duration: 0.25, ease: 'sine.inOut' }, T.t04);
tl.to('#r0 .sm', { color: 'rgba(246,240,231,0.62)', duration: 0.25, ease: 'sine.inOut' }, T.t04);
tl.fromTo('#r2', { y: 20.8 }, { y: 0, duration: 0.446, ease: 'power3.out', immediateRender: true }, T.t05);
tl.fromTo('#r2', { opacity: 0 }, { opacity: 1, duration: 0.372, ease: 'power2.out', immediateRender: true }, T.t05);
tl.fromTo('#r2', { filter: 'blur(8.0px)' }, { filter: 'blur(0px)', duration: 0.563, ease: 'power2.out', immediateRender: true }, T.t05);
tl.to('#r1', { backgroundColor: 'rgba(246,240,231,0)', color: '#F6F0E7', opacity: 0.38, duration: 0.25, ease: 'sine.inOut' }, T.t05);
tl.to('#r1 .sm', { color: 'rgba(246,240,231,0.62)', duration: 0.25, ease: 'sine.inOut' }, T.t05);
tl.fromTo('#sm', { y: 10.0 }, { y: 0, duration: 0.350, ease: 'power3.out', immediateRender: true }, T.t06);
tl.fromTo('#sm', { opacity: 0 }, { opacity: 1, duration: 0.300, ease: 'power2.out', immediateRender: true }, T.t06);
tl.fromTo('#sm', { filter: 'blur(8.0px)' }, { filter: 'blur(0px)', duration: 0.300, ease: 'power2.out', immediateRender: true }, T.t06);
tl.set('#pl', { visibility: 'visible' }, T.t01);
tl.set('#pl', { visibility: 'hidden' }, T.t07);
tl.set({}, {}, 6);
window.__timelines = window.__timelines || {};
window.__timelines['root'] = tl;
</script>
</body></html>
