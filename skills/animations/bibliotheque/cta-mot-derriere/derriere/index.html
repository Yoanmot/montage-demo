<!doctype html>
<html><head><meta charset="utf-8">
<style>
/* POLICE:debut (bloc écrit par scripts/lib/style.mjs depuis POLICES de commun.mjs : ne pas le modifier à la main) */
@font-face{font-family:'Inter Black';src:url('../../fonts/Inter-Black.ttf');font-weight:900;font-style:normal;}
.ti{font-family:'Inter Black';font-weight:900;text-transform:uppercase;line-height:0.92;
  letter-spacing:-0.02em;margin:0;}
.tx{font-family:'Inter Black';font-weight:900;line-height:1.06;letter-spacing:-0.02em;}
/* POLICE:fin */
@font-face{font-family:'Roboto';src:url('../../fonts/Roboto.ttf');font-weight:100 900;font-style:normal;}
html,body{margin:0;background:transparent;}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:transparent;}
.a{position:absolute;white-space:nowrap;}
.c-or{color:#F15A24;}.c-cr{color:#F6F0E7;}.c-ch{color:#1A1612;}
.douce{text-shadow:0 6px 30px rgba(0,0,0,.45);}.dure{text-shadow:0 4px 0 rgba(26,22,18,.6),0 0 20px rgba(0,0,0,.35);}
.pav{display:inline-block;background:#F15A24;color:#1A1612;border-radius:10px;
  padding:6px 20px 10px;box-shadow:0 5px 0 #B8400F;}
</style></head>
<body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-start="0" data-duration="3">
  <div class="a" style="inset:0;background:linear-gradient(to bottom,rgba(10,8,6,0.46) 0px,rgba(10,8,6,0.28) 520px,rgba(10,8,6,0) 1020px);"></div>
  <div class="a ti c-cr douce" id="abdos" style="left:94px;top:247.12px;font-size:259.22px">abdos</div>
</div>
<script>
// ===================================================== PARAMÈTRES (seule partie à changer d'une vidéo à l'autre)
// Textes : directement dans le HTML ci-dessus. Durée du calque : data-duration de #root et dernière ligne de la timeline.
// Instants en secondes depuis le début du calque (image n = n / 30). Chacun se cale sur l'attaque d'un mot de la voix
// (moins APPARITION.avance = 0,04 s pour une entrée animée). Les durées des tweens viennent de apparitionReglages(h).
const T = {
  t01: 1.5333,   // #abdos apparaît
};
</script>
<script src="../../vendor/gsap.min.js"></script>
<script>
const tl = gsap.timeline({ paused: true });
tl.fromTo('#abdos', { y: 24.5 }, { y: 0, duration: 0.471, ease: 'power3.out', immediateRender: true }, T.t01);
tl.fromTo('#abdos', { opacity: 0 }, { opacity: 1, duration: 0.390, ease: 'power2.out', immediateRender: true }, T.t01);
tl.fromTo('#abdos', { filter: 'blur(9.4px)' }, { filter: 'blur(0px)', duration: 0.631, ease: 'power2.out', immediateRender: true }, T.t01);
tl.set({}, {}, 3);
window.__timelines = window.__timelines || {};
window.__timelines['root'] = tl;
</script>
</body></html>
