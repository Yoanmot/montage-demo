<!doctype html>
<html><head><meta charset="utf-8">
<style>
/* POLICE:debut (bloc écrit par scripts/lib/style.mjs depuis POLICES de commun.mjs : ne pas le modifier à la main) */
@font-face{font-family:'Inter Black';src:url('../../fonts/Inter-Black.ttf');font-weight:900;font-style:normal;}
.ti{font-family:'Inter Black';font-weight:900;text-transform:uppercase;line-height:0.92;
  letter-spacing:-0.02em;margin:0;}
.tx{font-family:'Inter Black';font-weight:900;line-height:1.06;letter-spacing:-0.02em;}
/* POLICE:fin */
@font-face{font-family:'Roboto';src:url('../../fonts/Roboto.ttf');font-weight:100 900;font-style:normal;}
html,body{margin:0;background:transparent;}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:transparent;}
.a{position:absolute;white-space:nowrap;}
.c-or{color:#F15A24;}.c-cr{color:#F6F0E7;}.c-ch{color:#1A1612;}
.douce{text-shadow:0 6px 30px rgba(0,0,0,.45);}.dure{text-shadow:0 4px 0 rgba(26,22,18,.6),0 0 20px rgba(0,0,0,.35);}
.pav{display:inline-block;background:#F15A24;color:#1A1612;border-radius:10px;
  padding:6px 20px 10px;box-shadow:0 5px 0 #B8400F;}
</style></head>
<body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-start="0" data-duration="1.8666666666666667">
  <div class="a" style="inset:0;background:linear-gradient(to bottom,rgba(10,8,6,0.62) 0px,rgba(10,8,6,0.4) 600px,rgba(10,8,6,0) 1000px);"></div>
  <div class="a ti c-cr douce" id="h1" style="left:86px;top:250px;font-size:330px"><span id="h1n">120</span> <span id="h1u" style="text-transform:none">g</span></div>
  <div class="a tx c-cr douce" id="h2" style="left:96px;top:540px;font-size:60px">de protéines</div>
  <div class="a tx" id="h3" style="left:91px;top:625px;font-size:60px"><span class="pav" id="h3t">en 14 minutes</span></div>
</div>
<script>
// ===================================================== PARAMÈTRES (seule partie à changer d'une vidéo à l'autre)
// Textes : directement dans le HTML ci-dessus. Durée du calque : data-duration de #root et dernière ligne de la timeline.
// Instants en secondes depuis le début du calque (image n = n / 30). Chacun se cale sur l'attaque d'un mot de la voix
// (moins APPARITION.avance = 0,04 s pour une entrée animée). Les durées des tweens viennent de apparitionReglages(h).
const T = {
  t01: 0.0700,   // #h1 apparaît
  t02: 0.5000,   // #h2 apparaît
  t03: 0.8000,   // #h3 apparaît
};
</script>
<script src="../../vendor/gsap.min.js"></script>
<script>
const tl = gsap.timeline({ paused: true });
tl.fromTo('#h1', { y: 34.3 }, { y: 0, duration: 0.536, ease: 'power3.out', immediateRender: true }, T.t01);
tl.fromTo('#h1', { opacity: 0 }, { opacity: 1, duration: 0.440, ease: 'power2.out', immediateRender: true }, T.t01);
tl.fromTo('#h1', { filter: 'blur(13.2px)' }, { filter: 'blur(0px)', duration: 0.812, ease: 'power2.out', immediateRender: true }, T.t01);
tl.fromTo('#h2', { y: 10.0 }, { y: 0, duration: 0.350, ease: 'power3.out', immediateRender: true }, T.t02);
tl.fromTo('#h2', { opacity: 0 }, { opacity: 1, duration: 0.300, ease: 'power2.out', immediateRender: true }, T.t02);
tl.fromTo('#h2', { filter: 'blur(8.0px)' }, { filter: 'blur(0px)', duration: 0.300, ease: 'power2.out', immediateRender: true }, T.t02);
tl.fromTo('#h3', { y: 10.3 }, { y: 0, duration: 0.376, ease: 'power3.out', immediateRender: true }, T.t03);
tl.fromTo('#h3', { opacity: 0 }, { opacity: 1, duration: 0.319, ease: 'power2.out', immediateRender: true }, T.t03);
tl.fromTo('#h3', { filter: 'blur(8.0px)' }, { filter: 'blur(0px)', duration: 0.371, ease: 'power2.out', immediateRender: true }, T.t03);
tl.set({}, {}, 1.8666666666666667);
window.__timelines = window.__timelines || {};
window.__timelines['root'] = tl;
</script>
</body></html>
