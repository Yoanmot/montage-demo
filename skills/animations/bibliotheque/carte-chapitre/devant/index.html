<!doctype html>
<html><head><meta charset="utf-8">
<style>
/* POLICE:debut (bloc écrit par scripts/lib/style.mjs depuis POLICES de commun.mjs : ne pas le modifier à la main) */
@font-face{font-family:'Inter Black';src:url('../../fonts/Inter-Black.ttf');font-weight:900;font-style:normal;}
.ti{font-family:'Inter Black';font-weight:900;text-transform:uppercase;line-height:0.92;
  letter-spacing:-0.02em;margin:0;}
.tx{font-family:'Inter Black';font-weight:900;line-height:1.06;letter-spacing:-0.02em;}
/* POLICE:fin */
@font-face{font-family:'Roboto';src:url('../../fonts/Roboto.ttf');font-weight:100 900;font-style:normal;}
html,body{margin:0;background:transparent;}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:transparent;}
.a{position:absolute;white-space:nowrap;}
.c-or{color:#F15A24;}.c-cr{color:#F6F0E7;}.c-ch{color:#1A1612;}
.douce{text-shadow:0 6px 30px rgba(0,0,0,.45);}.dure{text-shadow:0 4px 0 rgba(26,22,18,.6),0 0 20px rgba(0,0,0,.35);}
.pav{display:inline-block;background:#F15A24;color:#1A1612;border-radius:10px;
  padding:6px 20px 10px;box-shadow:0 5px 0 #B8400F;}
</style></head>
<body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-start="0" data-duration="2.5">
  <div class="a" style="inset:0;background:linear-gradient(to bottom,rgba(10,8,6,0.62) 0px,rgba(10,8,6,0.4) 600px,rgba(10,8,6,0) 1000px);"></div>
  <div class="a" id="bl" style="left:91px;top:280px;display:flex;align-items:stretch;border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45)"><div class="ti c-ch num" style="background:#F15A24;font-size:200px;padding:20px 28px 4px;line-height:.8">1</div><div style="background:#1A1612;padding:26px 38px;display:grid;align-content:center"><div class="tx" id="pe" style="font-size:38px;color:rgba(246,240,231,0.7)">étape 1 sur 3</div><div class="ti c-cr" id="tt" style="font-size:120px">le poulet</div></div></div>
</div>
<script>
// ===================================================== PARAMÈTRES (seule partie à changer d'une vidéo à l'autre)
// Textes : directement dans le HTML ci-dessus. Durée du calque : data-duration de #root et dernière ligne de la timeline.
// Instants en secondes depuis le début du calque (image n = n / 30). Chacun se cale sur l'attaque d'un mot de la voix
// (moins APPARITION.avance = 0,04 s pour une entrée animée). Les durées des tweens viennent de apparitionReglages(h).
const T = {
  t01: 0.2300,   // #bl apparaît
  t02: 0.4000,   // #tt apparaît
  t03: 0.5700,   // #pe apparaît
};
</script>
<script src="../../vendor/gsap.min.js"></script>
<script>
const tl = gsap.timeline({ paused: true });
tl.fromTo('#bl', { y: 23.9 }, { y: 0, duration: 0.467, ease: 'power3.out', immediateRender: true }, T.t01);
tl.fromTo('#bl', { opacity: 0 }, { opacity: 1, duration: 0.387, ease: 'power2.out', immediateRender: true }, T.t01);
tl.fromTo('#bl', { filter: 'blur(9.2px)' }, { filter: 'blur(0px)', duration: 0.620, ease: 'power2.out', immediateRender: true }, T.t01);
tl.fromTo('#tt', { y: 12.5 }, { y: 0, duration: 0.390, ease: 'power3.out', immediateRender: true }, T.t02);
tl.fromTo('#tt', { opacity: 0 }, { opacity: 1, duration: 0.330, ease: 'power2.out', immediateRender: true }, T.t02);
tl.fromTo('#tt', { filter: 'blur(8.0px)' }, { filter: 'blur(0px)', duration: 0.410, ease: 'power2.out', immediateRender: true }, T.t02);
tl.fromTo('#pe', { y: 10.0 }, { y: 0, duration: 0.350, ease: 'power3.out', immediateRender: true }, T.t03);
tl.fromTo('#pe', { opacity: 0 }, { opacity: 1, duration: 0.300, ease: 'power2.out', immediateRender: true }, T.t03);
tl.fromTo('#pe', { filter: 'blur(8.0px)' }, { filter: 'blur(0px)', duration: 0.300, ease: 'power2.out', immediateRender: true }, T.t03);
tl.set({}, {}, 2.5);
window.__timelines = window.__timelines || {};
window.__timelines['root'] = tl;
</script>
</body></html>
