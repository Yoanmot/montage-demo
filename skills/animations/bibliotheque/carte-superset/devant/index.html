<!doctype html>
<html><head><meta charset="utf-8">
<style>
/* POLICE:debut (bloc écrit par scripts/lib/style.mjs depuis POLICES de commun.mjs : ne pas le modifier à la main) */
@font-face{font-family:'Inter Black';src:url('../../fonts/Inter-Black.ttf');font-weight:900;font-style:normal;}
.ti{font-family:'Inter Black';font-weight:900;text-transform:uppercase;line-height:0.92;
  letter-spacing:-0.02em;margin:0;}
.tx{font-family:'Inter Black';font-weight:900;line-height:1.06;letter-spacing:-0.02em;}
/* POLICE:fin */
@font-face{font-family:'Roboto';src:url('../../fonts/Roboto.ttf');font-weight:100 900;font-style:normal;}
html,body{margin:0;background:transparent;}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:transparent;}
.a{position:absolute;white-space:nowrap;}
.c-or{color:#F15A24;}.c-cr{color:#F6F0E7;}.c-ch{color:#1A1612;}
.douce{text-shadow:0 6px 30px rgba(0,0,0,.45);}.dure{text-shadow:0 4px 0 rgba(26,22,18,.6),0 0 20px rgba(0,0,0,.35);}
.pav{display:inline-block;background:#F15A24;color:#1A1612;border-radius:10px;
  padding:6px 20px 10px;box-shadow:0 5px 0 #B8400F;}

.card{position:absolute;background:#1A1612;color:#F6F0E7;border-radius:18px;box-shadow:inset 0 0 0 2px rgba(246,240,231,.08),0 18px 50px rgba(0,0,0,.5);font-family:'Inter Black';box-sizing:border-box;}
.card.tabbed{border-top-left-radius:0;}
.tab{position:absolute;left:0;bottom:100%;height:64px;padding:0 26px;background:#F15A24;color:#1A1612;font:900 46px/68px 'Inter Black';text-transform:uppercase;letter-spacing:.01em;border-radius:10px 10px 0 0;white-space:nowrap;}
.tab .n{opacity:0.62;margin-left:14px;}
.rw{display:grid;grid-template-columns:56px 132px minmax(0,1fr);align-items:center;gap:24px;padding:14px;border-radius:12px;}
.rw + .rw{margin-top:8px;}
.rw .i{font:900 72px/1 'Inter Black';color:#F15A24;text-align:center;}
.rw img{width:132px;height:132px;border-radius:10px;object-fit:cover;display:block;}
.rw .nm{font:900 46px/1.05 'Inter Black';letter-spacing:-.01em;}
.rw .sm{display:block;font:900 30px/1.2 'Inter Black';color:rgba(246,240,231,0.62);margin-top:6px;letter-spacing:0;}
.rw.on{background:#F6F0E7;color:#1A1612;}
.rw.on .sm{color:rgba(26,22,18,.6);}
.num{font-variant-numeric:tabular-nums;}.lc{text-transform:none;}
.rw.ss{grid-template-columns:132px minmax(0,1fr);}</style></head>
<body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-start="0" data-duration="3.7">
  <div id="pl" style="visibility:hidden"><div class="card tabbed" id="cd" style="left:91px;top:560px;width:899px;padding:30px">
    <div class="tab">superset</div>
    <div style="display:grid;grid-template-columns:14px minmax(0,1fr);gap:26px"><div id="bar" style="background:#F15A24;border-radius:7px;margin-block:70px"></div><div>
      <div class="rw ss on" id="r0"><img src="../../images/image-a-fournir.svg" data-a-fournir="image carrée de l'exercice 1 (extension triceps à la poulie), tirée de sa vidéo"><span class="nm">Extension triceps à la poulie</span></div>
      <div class="rw ss on" id="r1"><img src="../../images/image-a-fournir.svg" data-a-fournir="image carrée de l'exercice 2 (curl haltères), tirée de sa vidéo"><span class="nm">Curl<span class="sm">avec des haltères</span></span></div>
    </div></div>
  </div></div>
</div>
<script>
// ===================================================== PARAMÈTRES (seule partie à changer d'une vidéo à l'autre)
// Textes : directement dans le HTML ci-dessus. Durée du calque : data-duration de #root et dernière ligne de la timeline.
// Instants en secondes depuis le début du calque (image n = n / 30). Chacun se cale sur l'attaque d'un mot de la voix
// (moins APPARITION.avance = 0,04 s pour une entrée animée). Les durées des tweens viennent de apparitionReglages(h).
const T = {
  t01: 0.1700,   // #r0 apparaît
  t02: 1.6467,   // #r1 apparaît, #r0 bouge, #r0 .sm bouge
  t03: 1.8167,   // #bar apparaît
  t04: 3.6995,   // #pl caché
};
</script>
<script src="../../vendor/gsap.min.js"></script>
<script>
const tl = gsap.timeline({ paused: true });
tl.fromTo('#cd', { y: 36.4 }, { y: 0, duration: 0.550, ease: 'power3.out', immediateRender: true }, 0.0000);
tl.fromTo('#cd', { opacity: 0 }, { opacity: 1, duration: 0.450, ease: 'power2.out', immediateRender: true }, 0.0000);
tl.fromTo('#cd', { filter: 'blur(14.0px)' }, { filter: 'blur(0px)', duration: 0.850, ease: 'power2.out', immediateRender: true }, 0.0000);
tl.fromTo('#r0', { y: 20.8 }, { y: 0, duration: 0.446, ease: 'power3.out', immediateRender: true }, T.t01);
tl.fromTo('#r0', { opacity: 0 }, { opacity: 1, duration: 0.372, ease: 'power2.out', immediateRender: true }, T.t01);
tl.fromTo('#r0', { filter: 'blur(8.0px)' }, { filter: 'blur(0px)', duration: 0.563, ease: 'power2.out', immediateRender: true }, T.t01);
tl.fromTo('#r1', { y: 20.8 }, { y: 0, duration: 0.446, ease: 'power3.out', immediateRender: true }, T.t02);
tl.fromTo('#r1', { opacity: 0 }, { opacity: 1, duration: 0.372, ease: 'power2.out', immediateRender: true }, T.t02);
tl.fromTo('#r1', { filter: 'blur(8.0px)' }, { filter: 'blur(0px)', duration: 0.563, ease: 'power2.out', immediateRender: true }, T.t02);
tl.to('#r0', { backgroundColor: 'rgba(246,240,231,0)', color: '#F6F0E7', opacity: 0.38, duration: 0.25, ease: 'sine.inOut' }, T.t02);
tl.to('#r0 .sm', { color: 'rgba(246,240,231,0.62)', duration: 0.25, ease: 'sine.inOut' }, T.t02);
tl.fromTo('#bar', { y: 24.4 }, { y: 0, duration: 0.470, ease: 'power3.out', immediateRender: true }, T.t03);
tl.fromTo('#bar', { opacity: 0 }, { opacity: 1, duration: 0.390, ease: 'power2.out', immediateRender: true }, T.t03);
tl.fromTo('#bar', { filter: 'blur(9.4px)' }, { filter: 'blur(0px)', duration: 0.630, ease: 'power2.out', immediateRender: true }, T.t03);
tl.set('#pl', { visibility: 'visible' }, 0.0000);
tl.set('#pl', { visibility: 'hidden' }, T.t04);
tl.set({}, {}, 3.7);
window.__timelines = window.__timelines || {};
window.__timelines['root'] = tl;
</script>
</body></html>
